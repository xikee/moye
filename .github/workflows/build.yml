name: Build macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - run: npm run build
      - name: Verify code signature
        run: codesign --verify --deep --strict "build/墨页.app"
      - name: Package Apple Silicon app
        run: ditto -c -k --keepParent "build/墨页.app" "build/MoYe-macOS-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: MoYe-macOS-arm64
          path: build/MoYe-macOS-arm64.zip
